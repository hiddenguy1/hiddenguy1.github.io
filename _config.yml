# Hexo Configuration
# Docs: https://hexo.io/docs/configuration.html

# Site
title: duduHexo
subtitle: ''
description: ''
keywords:
author: dudu
language: zh-CN
timezone: ''

# URL
url: https://hiddenguy1.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# SEO Settings
sitemap:
  path: sitemap.xml
  tag: true
  category: true

robotstxt:
  useragent: "*"
  allow:
    - /
  disallow:
    - /js/
    - /css/
    - /fonts/
  sitemap: https://hiddenguy1.github.io/sitemap.xml

# Analytics (Google Analytics)
google_analytics:
  enable: false
  tracking_id: # UA-XXXXXXXXX-X or G-XXXXXXXXXX

# Baidu Analytics
baidu_analytics:
  enable: false
  tracking_id: # Your Baidu Analytics ID

# Baidu Site Verification
baidu_site_verification:
  enable: false
  verification_code: # Your Baidu verification code

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: yilia

# Search
search:
  path: search.xml
  field: post
  content: true
  format: html

# Related Posts Plugin
related_posts:
  enable: true
  title: 相关文章推荐
  display_in_home: true
  display_in_post: true
  params:
    maxCount: 5
    pLength: 1
    ppFormat: 'none'
    isPicture: false
    autoArchive: false
    meta: false
    excerpt: false
    excerptLength: 100
    excerptDelimiter: ''
    coverType: 'none'

# Deployment
deploy:
  type: git
  repo: https://github.com/hiddenguy1/hiddenguy1.github.io.git
  branch: master
